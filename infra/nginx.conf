worker_processes auto;
# Soak runs sustain >1k simultaneous client connections; the default 1024 per
# worker starts refusing sockets (502s) as soon as the tail latency grows.
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Re-resolved at runtime: a restarted or recreated replica can get a new IP, and
  # a name resolved once at startup would never find it again.
  # ${NGINX_LOCAL_RESOLVERS} is filled in by the image's entrypoint.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=1s;

  upstream api {
    zone api 64k;
    # max_fails=0: one slow connect during a spike must not mark a healthy replica
    # down. Dead replicas leave DNS within a second, and connects fail over anyway.
    server api:3000 resolve max_fails=0;
    # Reuse upstream connections instead of opening one per request.
    keepalive 256;
    keepalive_requests 10000;
  }

  upstream web {
    zone web 64k;
    server web:80 resolve;
  }

  # Per-client-IP rate limit, filled in from RATE_LIMIT_RPS. The burst absorbs a
  # legitimate spike; nodelay answers excess requests at once instead of queueing
  # them until they time out. 429 comes back as JSON, the same shape as the API.
  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=${RATE_LIMIT_RPS}r/s;
  # Scrapes are rare and each refresh costs Redis and SQS calls, so they get their
  # own much smaller allowance.
  limit_req_zone $binary_remote_addr zone=metrics_rate:1m rate=5r/s;
  limit_req_status 429;

  # Route around a dead replica quickly. A request that never reached it is safe
  # to retry on another, even a POST.
  proxy_connect_timeout 1s;

  server {
    listen 80;
    server_name _;

    add_header X-Upstream $upstream_addr always;
    add_header X-Trace-Id $request_id always;

    location = /healthz {
      proxy_pass http://api;
      proxy_set_header Host $host;
    }

    location = /readyz {
      proxy_pass http://api;
      proxy_set_header Host $host;
    }

    location /api/ {
      limit_req zone=api_rate burst=${RATE_LIMIT_BURST} nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
    }

    location = /metrics {
      limit_req zone=metrics_rate burst=10 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
    }

    error_page 429 = @rate_limited;
    location @rate_limited {
      default_type application/json;
      # add_header here replaces the server-level ones, so repeat the trace id.
      add_header X-Trace-Id $request_id always;
      add_header Retry-After 1 always;
      return 429 '{"code":"RATE_LIMITED"}';
    }

    location /admin/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }
  }
}
